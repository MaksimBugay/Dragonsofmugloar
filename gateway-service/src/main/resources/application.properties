# default configuration

spring.application.name=gateway-service

server.shutdown=graceful

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

rdm.service.internal-api.url.GATEWAY=http://bmv-gateway-service:8080/internal-api
rdm.service.internal-api.url.DATA_READER=http://ttc-rdm-data-reader:8080/internal-api
rdm.service.internal-api.url.DATA_MODIFIER=http://ttc-rdm-data-modifier:8080/internal-api
rdm.service.internal-api.url.SRA=http://ttc-rdm-sra-service:8080/internal-api
rdm.service.internal-api.url.TRANSLATION=http://ttc-rdm-translation-service:8080/internal-api
rdm.service.internal-api.url.ACCOUNT=http://ttc-rdm-account-manager:8080/internal-api

SERVICE_PUBLIC_URL=http://localhost:8080

dragonsofmugloar.api.url=https://dragonsofmugloar.com/api/v2

rdm.internal-api.port-mode=HTTP1

rdm.error.base-uri=https://developers.dev.trimble-transportation.com/Data_Governance_RDM/Reference_Data_Management_Service/how-tos

bmv.redis.enabled=false

rdm.cluster.secret=TEST

rdm.cache.expire-after-sec=86400