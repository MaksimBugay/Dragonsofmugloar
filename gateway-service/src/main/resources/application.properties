# suppress inspection "SpringBootApplicationProperties" for whole file
# default configuration

spring.application.name=gateway-service

server.shutdown=graceful

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.operations-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

bmv.service.internal-api.url.GATEWAY=http://gateway-service:8080/internal-api
bmv.service.internal-api.url.DATA_READER=http://data-reader:8080/internal-api
bmv.service.internal-api.url.DATA_MODIFIER=http://data-modifier:8080/internal-api
bmv.service.internal-api.url.SRA=http://sra-service:8080/internal-api
bmv.service.internal-api.url.TRANSLATION=http://translation-service:8080/internal-api
bmv.service.internal-api.url.ACCOUNT=http://account-manager:8080/internal-api

dragonsofmugloar.api.url=https://dragonsofmugloar.com/api/v2

bmv.internal-api.port-mode=HTTP1

bmv.error.base-uri=https://secure.fileshare.ovh/how-tos

bmv.redis.enabled=false

bmv.cluster.secret=TEST

bmv.cache.expire-after-sec=86400