# override or extend default configurations for dev environment
rdm.service.internal-api.http-web-client.connection-timeout-ms=180000
rdm.service.internal-api.http-web-client.memory-buffer-size=671088640

bmv.redis.enabled=true
bmv.redis.setup-type=standalone
bmv.redis.host=${REDIS_HOST_URI}
bmv.redis.password=${REDIS_PASSWORD}
bmv.redis.ssl=true
bmv.redis.auto-reconnect=true
bmv.redis.standalone.conn.command-timeout-millis=100