# override or extend default configurations for prod environment

rdm.service.internal-api.http-web-client.pool-size=250
rdm.service.internal-api.http-web-client.max-queue-size=1500
rdm.service.internal-api.http-web-client.connection-timeout-ms=180000
rdm.service.internal-api.http-web-client.read-timeout-ms=180000

rdm.authz-integration.enabled=true

rdm.redis.enabled=true
rdm.redis.setup-type=standalone
rdm.redis.host=${REDIS_HOST_URI}
rdm.redis.password=${REDIS_PASSWORD}
rdm.redis.ssl=true
rdm.redis.auto-reconnect=true
rdm.redis.standalone.conn.command-timeout-millis=100

rdm.service.public.url=https://eu1.api.trimble.com/transportation