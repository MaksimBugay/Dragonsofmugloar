# Test-specific configuration
# Override the error base URI with a mock URL for testing
bmv.error.base-uri=http://test.example.com/rdm/errors

# Mock service configuration for tests
SERVICE_PUBLIC_URL=http://test.example.com
bmv.service.public.url=http://test.example.com

# Disable external dependencies for testing
management.endpoint.health.enabled=true

# Test logging configuration
logging.level.com.bmv=DEBUG

bmv.ai.cloud.azure.gpt-54.url=https://eastus.api.cognitive.microsoft.com/openai/deployments/gpt-54
bmv.ai.cloud.azure.gpt-54.access-key=YOUR_AZURE_GPT_54_API_KEY
